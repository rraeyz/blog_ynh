#:schema https://raw.githubusercontent.com/YunoHost/apps/master/schemas/manifest.v2.schema.json

packaging_format = 2

id = "blog"
name = "Blog"
description.en = "Turkish explainers of new research papers written with AI, with a weekly newsletter via Künye"
description.tr = "Yeni makalelerin yapay zekâ ile yazılmış Türkçe anlatımları ve Künye üzerinden haftalık bülten"

version = "0.1.0~ynh1"

maintainers = ["rraeyz"]

[upstream]
license = "MIT"
code = "https://github.com/rraeyz/blog_ynh"
admindoc = "https://github.com/rraeyz/blog_ynh/blob/main/YUNOHOST-KURULUM.md"

[integration]
yunohost = ">= 11.3"
architectures = "all"
multi_instance = true
ldap = false
sso = false
disk = "500M"
ram.build = "1G"
ram.runtime = "256M"

[install]
    [install.domain]
    type = "domain"
    help.en = "Choose a domain, e.g. blog.example.com"
    help.tr = "Bir domain seçin, ör. blog.rraeyz.me"

    [install.path]
    type = "path"
    default = "/"
    help.en = "Installing on a sub-path is not supported, keep it as /"
    help.tr = "Alt yola kurulum desteklenmiyor, / olarak bırakın"

    [install.init_main_permission]
    type = "group"
    default = "visitors"
    help.en = "Who can read the blog"
    help.tr = "Blogu kimler okuyabilir"

[resources]
    [resources.system_user]

    [resources.install_dir]
    dir = "/opt/yunohost/__APP__"

    [resources.data_dir]
    dir = "/home/yunohost.app/__APP__"

    [resources.permissions]
    main.url = "/"

    [resources.ports]
    main.default = 3010

    [resources.apt]
    packages = []

    # __YNH_DEBIAN_VERSION__ YunoHost tarafından sunucunun Debian sürümüyle değiştirilir (YunoHost >= 11.3)
    extras.docker.repo = "deb https://download.docker.com/linux/debian __YNH_DEBIAN_VERSION__ stable"
    extras.docker.key = "https://download.docker.com/linux/debian/gpg"
    extras.docker.packages = ["docker-ce", "docker-ce-cli", "containerd.io", "docker-compose-plugin"]
